[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pila-sdk"
version = "0.1.0"
description = "Python SDK for the Pila agent orchestration platform"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["pila", "agents", "agent-registry", "ai", "orchestration"]
authors = [{ name = "Pila AI" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[project.urls]
Homepage = "https://github.com/dannyhilariosuarez/pila"
Repository = "https://github.com/dannyhilariosuarez/pila"
Documentation = "https://github.com/dannyhilariosuarez/pila/tree/main/sdks/python"
Issues = "https://github.com/dannyhilariosuarez/pila/issues"

[tool.hatch.build.targets.wheel]
packages = ["pila"]

[tool.hatch.build.targets.sdist]
include = ["pila", "tests", "README.md", "LICENSE"]
